<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 菜谱助手</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--text2:#86868b;--border:#e5e5e7;--tag:#f0f0f2;--primary:#e94e3b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;align-items:center}
.nav h1{font-size:17px;font-weight:600}
.nav-badge{font-size:11px;color:var(--text2);background:var(--tag);padding:3px 10px;border-radius:20px;margin-left:8px}
.nav-right{margin-left:auto;display:flex;gap:6px}
.btn-sm{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)}.btn-sm:hover{background:var(--tag);border-color:#ccc}
.container{max-width:720px;margin:0 auto;padding:24px 20px}
.hero{text-align:center;margin-bottom:28px}
.hero h2{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.hero p{font-size:15px;color:var(--text2)}
.card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px}
label{font-size:13px;font-weight:600;color:var(--text2);display:block;margin-bottom:8px}
textarea,input[type="text"]{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:15px;outline:none;font-family:inherit;transition:border-color .2s;background:var(--bg)}
textarea:focus,input:focus{border-color:var(--primary)}
textarea{min-height:65px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:var(--tag);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all .2s;color:var(--text)}
.tag:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn{background:var(--primary);color:#fff;border:none;padding:13px 24px;border-radius:12px;font-size:15px;cursor:pointer;width:100%;transition:transform .1s;font-weight:500;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#ccc;cursor:not-allowed}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.recipe-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.recipe-item{background:var(--tag);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s}
.recipe-item:hover{background:#e8e8ec;transform:translateY(-1px)}
.recipe-item .name{font-weight:600;font-size:15px;margin-bottom:3px}
.recipe-item .meta{font-size:12px;color:var(--text2)}
.recipe-item .desc{font-size:13px;color:#666;margin-top:4px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:200;backdrop-filter:blur(4px);padding:20px;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-size:20px;font-weight:700;margin-bottom:10px}
.modal h3{font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 6px}
.modal ul{padding-left:16px;line-height:2;font-size:14px;color:#444}
.modal ol{padding-left:16px;line-height:2;font-size:14px;color:#444}
.modal .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;background:var(--tag);margin:2px 3px 2px 0;cursor:default}
.modal-close{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;margin-top:14px;font-family:inherit;transition:background .15s}
.modal-close:hover{background:var(--tag)}
.gen-area{display:none;margin-top:20px}
.gen-area.show{display:block}
.footer{text-align:center;color:var(--text2);font-size:12px;margin-top:32px;padding-bottom:20px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text2)}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
</style>
</head>

const FOOD=["鸡蛋","番茄","豆腐","猪肉","鸡胸肉","虾仁","土豆","胡萝卜","洋葱","青菜","西兰花","黄瓜","木耳","排骨","面条","茄子","白菜","花菜","玉米","青椒","蒜","莲藕","丝瓜","苦瓜","四季豆","生菜","包菜","鸭","牛腩","粉丝","空心菜","韭菜","娃娃菜","平菇","金针菇","海带","豆芽","酸菜","腊肉","牛肉","带鱼","鲫鱼","鱼头","鸡腿","鸡翅","鸡"];
FOOD.forEach(f=>{const t=document.createElement("span");t.className="tag";t.textContent=f;t.onclick=()=>{const i=document.getElementById("ings");i.value=i.value?i.value+"、"+f:f;i.focus()};document.getElementById("tagBar").appendChild(t)});

let currentFilter="all";let lastResults=[];

function getCat(){const s=new Set();DB.forEach(r=>r.c.forEach(t=>s.add(t)));return[...s]}

function buildF(){
const fb=document.getElementById("filterBar");
const cats=getCat();
fb.innerHTML='<button class="filter-btn active" data-f="all" onclick="setF(\'all\')">全部</button>';
cats.forEach(t=>{const b=document.createElement("button");b.className="filter-btn";b.dataset.f=t;b.textContent=t;b.onclick=()=>setF(t);fb.appendChild(b)});
}

function setF(f){currentFilter=f;document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.dataset.f===f));renderR(lastResults)}

function getDet(name){const d=DETS[name];if(!d)return null;const p=d.split("//");return{i:p[0].split("|"),s:p[1].split("|")}}

function renderR(results){
const list=document.getElementById("resultList");
const filtered=currentFilter==="all"?results:results.filter(r=>r.c.includes(currentFilter));
if(!filtered.length){list.innerHTML='<div class="empty"><div style="font-size:30px">🔍</div><p>该分类下没有菜谱</p></div>';return}
list.innerHTML=filtered.map(r=>`<div class="recipe-item" onclick="showD('${r.name}')"><div class="name">${r.name}</div><div class="meta">${r.t} · ${r.d} · 匹配${r.match}种食材</div><div class="desc">${r.m}</div></div>`).join("");
}

function generate(){
const input=document.getElementById("ings").value.trim();
if(!input){alert("请输入食材");return}
const u=input.split(/[，,、\s]+/).filter(Boolean);
const btn=document.getElementById("genBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span>AI 正在思考...';
setTimeout(()=>{
const scored=DB.map(r=>{let m=0;u.forEach(ui=>{if(r.i.some(ri=>ri.includes(ui)||ui.includes(ri)))m++});return{...r,match:m,rate:u.length?m/Math.max(u.length,r.i.length):0}});
scored.sort((a,b)=>b.rate-a.rate||a.i.length-b.i.length);
lastResults=scored.filter(r=>r.match>0);
const area=document.getElementById("genArea");const empty=document.getElementById("empty");
area.classList.add("show");empty.style.display="none";
buildF();setF("all");
if(!lastResults.length){document.getElementById("resultList").innerHTML='<div class="empty"><div style="font-size:30px">🔍</div><p>没找到菜谱，试试其他食材</p></div>';btn.disabled=false;btn.innerHTML='✨ AI 推荐菜谱';return}
renderR(lastResults);
btn.disabled=false;btn.innerHTML='✨ AI 推荐菜谱';
},1500);
}

function showD(name){
const r=DB.find(x=>x.name===name);const d=getDet(name);
if(!r||!d)return;
const m=document.getElementById("modal");const b=document.getElementById("modalBody");
b.innerHTML="";
const h2=document.createElement("h2");h2.textContent=r.name;b.appendChild(h2);
const meta=document.createElement("div");meta.style.cssText="font-size:13px;color:var(--text2);margin-bottom:10px";
meta.textContent=r.t+" · "+r.d+" "+r.c.join(" ");b.appendChild(meta);
const h3i=document.createElement("h3");h3i.textContent="食材清单";b.appendChild(h3i);
const ul=document.createElement("ul");
d.i.forEach(function(x){const li=document.createElement("li");li.textContent=x;ul.appendChild(li)});b.appendChild(ul);
const h3s=document.createElement("h3");h3s.textContent="做法";b.appendChild(h3s);
const ol=document.createElement("ol");
d.s.forEach(function(x){const li=document.createElement("li");li.textContent=x;ol.appendChild(li)});b.appendChild(ol);
const btn1=document.createElement("button");btn1.className="modal-close";btn1.textContent="复制菜谱";
btn1.onclick=function(){copyR(name)};b.appendChild(btn1);
const btn2=document.createElement("button");btn2.className="modal-close";btn2.textContent="关闭";
btn2.onclick=function(){closeD()};b.appendChild(btn2);
m.classList.add("show");document.body.style.overflow="hidden";
}

function closeD(){document.getElementById("modal").classList.remove("show");document.body.style.overflow=""}

function copyR(name){
const r=DB.find(x=>x.name===name);const d=getDet(name);
if(!r||!d)return;
let t="【"+r.name+"】\\n食材："+d.i.join("、")+"\\n\\n做法：\\n";d.s.forEach((s,j)=>{t+=(j+1)+". "+s+"\\n"});
navigator.clipboard.writeText(t).then(()=>{const x=document.createElement("div");x.style.cssText="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:400";x.textContent="已复制";document.body.appendChild(x);setTimeout(()=>x.remove(),1500)});
}

function randomPick(){
const r=DB[Math.floor(Math.random()*DB.length)];showD(r.name);
}

function resetAll(){
document.getElementById("ings").value="";document.getElementById("pref").value="";
document.getElementById("genArea").classList.remove("show");document.getElementById("empty").style.display="block";
document.getElementById("filterBar").innerHTML="";lastResults=[];
}
</script>
